ых после гонки":"Hot after racing","Давление не нужно проверять":"It needn't be checked","Что защищает мотор от перегрева и замерзания?":"What protects the engine from overheating and freezing?","Антифриз не кипит и не замерзает так легко.":"Coolant doesn't boil or freeze easily.","Вода из лужи":"Puddle water","Сок":"Juice","Что делают тормозные колодки?":"What do brake pads do?","Колодки сжимают диск и замедляют колесо.":"Pads squeeze the disc and slow the wheel.","Прижимаются к диску и тормозят":"Press on the disc to brake","Включают свет":"Turn on lights","Греют салон":"Heat the cabin","Что делает аккумулятор?":"What does the battery do?","Аккумулятор даёт ток для запуска и электрики.":"It supplies current for starting and electronics.","Запускает мотор и питает свет":"Starts the engine and powers lights","Охлаждает мотор":"Cools the engine","Надувает шины":"Inflates tires","Что делает домкрат?":"What does a jack do?","Домкрат приподнимает машину, чтобы снять колесо.":"A jack lifts the car so you can remove a wheel.","Поднимает машину":"Lifts the car","Заливает бензин":"Pours fuel","Меняет масло":"Changes oil","Какая дистанция безопасна в дождь?":"What distance is safe in rain?","На мокрой дороге тормозной путь длиннее.":"Braking takes longer on wet roads.","Больше обычной":"Longer than usual","Меньше обычной":"Shorter","Вплотную":"Bumper to bumper","Когда включать фары?":"When should you turn on headlights?","В сумерки, туман и дождь — обязательно.":"At dusk, in fog and rain — always.","В сумерки и туман":"At dusk and in fog","Только в полдень":"Only at noon","Куда смотреть за рулём?":"Where should a driver look?","Взгляд в телефон на секунду — это десятки метров вслепую.":"A one-second glance away is tens of metres blind.","На дорогу":"At the road","В телефон":"At the phone","На пассажиров":"At passengers","Что делать, если ты устал за рулём?":"What if you're tired while driving?","Усталость опасна — сделай перерыв.":"Fatigue is dangerous — take a break.","Остановиться и отдохнуть":"Stop and rest","Включить музыку погромче":"Turn music up","Что нужно держать в машине?":"What should be kept in the car?","Огнетушитель и аптечка могут спасти жизнь.":"They can save a life.","Огнетушитель и аптечку":"Fire extinguisher and first-aid kit","Мороженое":"Ice cream","Фейерверки":"Fireworks","Что означает значок масленки на панели?":"What does the oil can icon mean?","Загорелась масленка — остановись и проверь масло.":"If it lights up, stop and check the oil.","Низкое давление масла":"Low oil pressure","Открыта дверь":"Door open","Включены фары":"Lights on","Что означает значок аккумулятора на панели?":"What does the battery icon on the dash mean?","Значит, аккумулятор не заряжается.":"The battery isn't charging.","Проблема с зарядкой":"Charging problem","Закончился бензин":"Out of fuel","Включён обогрев":"Heating on","Что делает мотор в машине?":"What does the engine do?","Двигатель сжигает топливо и крутит колёса.":"It burns fuel and turns the wheels.","Превращает топливо в движение":"Turns fuel into motion","Охлаждает салон":"Cools the cabin","Моет окна":"Washes windows","Почему нельзя ездить на пустом баке?":"Why not run on an empty tank?","Топливо охлаждает насос, а осадок забивает фильтр.":"Fuel cools the pump; sediment clogs the filter.","Насос греется, со дна идёт грязь":"Pump overheats, sediment gets sucked up","Машина станет легче":"The car gets lighter","Ничего страшного":"Nothing serious","Что делать при скрипе тормозов?":"What to do about squeaky brakes?","Скрип — сигнал, что колодки изношены.":"Squeaking means worn pads.","Проверить колодки":"Check the pads","Ехать дальше":"Keep driving","Накачать шины":"Inflate tires","Какой знак разрешает идти пешеходам?":"Which sign shows where pedestrians cross?","На переходе пешеходам уступают дорогу.":"Drivers yield at crossings.","Пешеходный переход":"Pedestrian crossing","Кирпич":"No entry","Стоп":"Stop","🎓 Викторина":"🎓 Quiz","🎓 Результат":"🎓 Result","Верно! +3 💰":"Correct! +3 💰","Не совсем…":"Not quite…","Результат":"Result","Ещё раз":"Again","В меню":"Menu","Отличный водитель!":"Excellent driver!","Хороший водитель!":"Good driver!","Ещё немного практики!":"A bit more practice!","Почитай советы и попробуй снова!":"Read the tips and try again!","Бонус за все ответы +10":"Perfect-score bonus +10","Масло меняй раз в 10 000 км или раз в год. Я однажды забыл — мотор стучал так, будто просил пощады!":"Change oil every 10,000 km or once a year. I once forgot — the engine knocked like it was begging for mercy!","Давление в шинах проверяй раз в месяц на холодных колёсах. Шина без воздуха — как я без кофе: еле еду.":"Check tire pressure monthly on cold tires. A flat tire is like me without coffee: barely moving.","Болты колеса затягивай крест-накрест. Иначе колесо решит отправиться в самостоятельное путешествие!":"Tighten wheel bolts in a cross pattern. Otherwise the wheel may go on a trip of its own!","Зимой аккумулятор садится быстрее — он тоже мёрзнет. Проверь заряд до морозов, а не при минус двадцать.":"In winter the battery drains faster — it gets cold too. Check it before frost, not at minus twenty.","Красный — плюс, чёрный — минус. Подключаешь: сначала плюс. Отключаешь: сначала минус. Я запомнил после искр!":"Red is plus, black is minus. Connect plus first; disconnect minus first. I learned it after the sparks!","Лампы меняй парой: перегорела одна — вторая скоро следом. Фара с одним глазом — это не стиль, а штраф.":"Replace bulbs in pairs: when one burns out, the other follows soon. One-eyed headlights aren't style, they're a fine.","Огнетушитель и аптечка в машине — как запасной парашют: надеешься, что не пригодится, но с ним спокойнее. Смотри срок годности!":"A fire extinguisher and first-aid kit are like a spare parachute: you hope not to need them, but it feels safer. Check the expiry date!","Пристёгивайся и сзади тоже! В аварии пассажир без ремня становится летающим багажом.":"Buckle up in the back too! In a crash an unbelted passenger becomes flying luggage.","Держи две секунды дистанции: машина впереди проехала столб — считай «двадцать один, двадцать два». В дождь — вдвое больше.":"Keep a two-second gap: when the car ahead passes a pole, count \"one-thousand-one, one-thousand-two\". Double it in rain.","На льду тормозной путь в разы длиннее. Лихачить на льду — кататься как пингвин, только без смеха.":"On ice, braking distance is several times longer. Speeding on ice means sliding like a penguin, only not funny.","В ливень включи ближний свет и сбрось скорость. «Поплыть» по лужам весело только уткам.":"In heavy rain, use low beams and slow down. Hydroplaning is fun only for ducks.","Антифриз не даёт мотору ни кипеть, ни замерзать. Воду из-под крана вместо него не лей — получишь ледяную скульптуру внутри мотора!":"Coolant stops the engine from boiling or freezing. Don't use tap water instead — you'll get an ice sculpture inside the engine!","Стрелка в красной зоне — остановись и заглуши мотор. Горячую крышку радиатора не открывай: фонтан будет не праздничный!":"Needle in the red — stop and switch off. Don't open a hot radiator cap: the fountain won't be festive!","Скрип при торможении — колодки просят замены. Не жди скрежета металла: он обойдётся дороже.":"Squeaking when braking means the pads want replacing. Don't wait for metal grinding: it costs more.","Настрой зеркала до выезда и всё равно оглядывайся: в слепой зоне любит прятаться чужая машина.":"Adjust mirrors before driving and still look over your shoulder: other cars love hiding in the blind spot.","Телефон за рулём — враг. Секунда в экран на 90 км/ч — это 25 метров вслепую. Сообщение подождёт, дорога нет!":"The phone is the enemy. One second on the screen at 90 km/h is 25 m blind. The message can wait, the road can't!","Устал — остановись и отдохни, перерыв каждые два часа. Лучше вздремнуть на парковке, чем в кювете.":"Tired? Stop and rest, take a break every two hours. Better a nap in a parking lot than in a ditch.","Дети ездят только в кресле и пристёгнутыми — даже если «мы только до магазина».":"Kids ride only in a child seat and buckled — even if \"we're only going to the shop\".","Не гони бак «в ноль»: насос охлаждается топливом, а со дна может подняться грязь.":"Don't run the tank to empty: the pump is cooled by fuel and dirt can rise from the bottom.","Новый стук, скрип или вибрация — машина просит помощи, а не просто ворчит. Послушай её!":"A new knock, squeak or vibration — the car is asking for help, not just grumbling. Listen to it!","Чистые стёкла и фары — это безопасность. Шукур подметает мастерскую, а ты протри стёкла!":"Clean glass and lights mean safety. Shukur sweeps the garage, and you wipe your windows!","Жёлтый — это «приготовься тормозить», а не «газуй изо всех сил».":"Yellow means \"get ready to brake\", not \"floor it\".","Включай фары в сумерки и туман, не дожидаясь полной темноты: тебя должны видеть.":"Turn on headlights at dusk and in fog, not when it's pitch dark: others must see you.","Проверь запаску и домкрат заранее. Запаска без воздуха — просто тяжёлый бублик.":"Check the spare and the jack in advance. A flat spare is just a heavy donut.","Зимой заливай незамерзающую омывайку. Летняя замёрзнет — и поедешь вслепую, как крот.":"In winter use antifreeze washer fluid. Summer fluid freezes and you'll drive blind like a mole.","Ослепили встречные фары? Сбрось скорость, включи аварийку и смотри на правый край дороги, а не в свет.":"Blinded by oncoming lights? Slow down, turn on hazards and look at the right edge of the road, not at the glare.","Два равнозначных перекрёстка без знаков. Кто проезжает первым?":"Two equal roads, no signs. Who goes first?","Помеха справа: уступай тому, кто приближается справа.":"Give way to whoever approaches from the right.","Тот, кто справа":"The one on the right","Тот, кто слева":"The one on the left","Тот, у кого машина больше":"The one with the bigger car","Тот, кто едет быстрее":"The faster one","Какая безопасная дистанция при скорости 90 км/ч (примерно)?":"What safe gap at 90 km/h (roughly)?","Правило двух секунд: при 90 км/ч это около 50 метров.":"Two-second rule: about 50 m at 90 km/h.","5 метров":"5 m","15 метров":"15 m","50 метров":"50 m","200 метров":"200 m","Во сколько раз вырастет тормозной путь, если скорость увеличить вдвое?":"By how much does braking distance grow if speed doubles?","Тормозной путь растёт пропорционально квадрату скорости.":"Braking distance grows with the square of speed.","В 2 раза":"2×","В 4 раза":"4×","В 8 раз":"8×","Не изменится":"No change","Машина «поплыла» по луже (аквапланирование). Что делать?":"The car hydroplanes. What to do?","Плавно отпусти газ и держи руль прямо, пока шины не вернут сцепление.":"Ease off and keep straight until the tires regain grip.","Резко тормозить":"Brake hard","Резко крутить руль":"Turn sharply","Плавно сбросить газ, держать руль ровно":"Ease off the gas, hold steering straight","Добавить газ":"Accelerate","Заднюю часть машины занесло вправо. Куда повернуть руль?":"The rear slides right. Which way do you steer?","Рулить нужно в сторону заноса и плавно сбавлять газ.":"Steer into the skid and ease off the gas.","Вправо, в сторону заноса":"Right, into the skid","Влево":"Left","Резко тормозить и не трогать руль":"Brake hard and don't touch the wheel","Руль не нужен":"No steering","За сколько метров от машины в городе ставят знак аварийной остановки?":"How far behind the car in town must the warning triangle be placed?","В населённом пункте — не менее 15 м, за городом — 30 м.":"In town at least 15 m, outside town 30 m.","Не менее 15 м":"At least 15 m","Не менее 5 м":"At least 5 m","Не менее 50 м":"At least 50 m","Прямо у бампера":"Right at the bumper","Тебя ослепили встречные фары. Что правильно?":"Oncoming lights blind you. What's right?","Снизь скорость, включи аварийку и ориентируйся по правому краю дороги.":"Slow down, hazards on, look at the right edge of the road.","Сбросить скорость, включить аварийку, смотреть на правый край":"Slow down, hazards on, watch the right edge","Закрыть глаза":"Close your eyes","Посигналить и ехать дальше":"Honk and carry on","Как правильно держать руль?":"How should you hold the wheel?","Обе руки на 9 и 3 часа дают точный контроль.":"Both hands at 9 and 3 give precise control.","На «9 и 3 часа»":"At 9 and 3 o'clock","Одной рукой снизу":"One hand from below","На «12 часов» одной рукой":"One hand at 12","За спицы":"By the spokes","Что делает свеча зажигания в бензиновом моторе?":"What does a spark plug do in a petrol engine?","Свеча поджигает топливно-воздушную смесь.":"It ignites the air-fuel mixture.","Даёт искру для поджига смеси":"Makes the spark that ignites the mix","Охлаждает поршни":"Cools pistons","Фильтрует топливо":"Filters fuel","Смазывает клапаны":"Lubricates valves","Для чего в моторе термостат?":"What is the thermostat for?","Он помогает мотору быстро прогреться и не перегреваться.":"It helps the engine warm up quickly and avoid overheating.","Регулирует поток охлаждающей жидкости и прогрев":"Regulates coolant flow and warm-up","Включает печку":"Turns on the heater","Измеряет масло":"Measures oil","Заряжает аккумулятор":"Charges battery","Что делает система ABS?":"What does ABS do?","На скользкой дороге можно тормозить и при этом рулить.":"You can brake and still steer on slippery roads.","Не даёт колёсам блокироваться при торможении":"Prevents wheel lock-up when braking","Увеличивает мощность":"Adds power","Включает дальний свет":"Turns on high beams","Экономит бензин":"Saves fuel","Для чего нужен ремень ГРМ?":"What is the timing belt for?","Он согласует работу поршней и клапанов.":"It coordinates pistons and valves.","Синхронизирует коленвал и распредвал":"Synchronises crankshaft and camshaft","Крутит генератор кондиционера":"Spins the A/C","Держит капот":"Holds the hood","Подаёт бензин":"Feeds fuel","Что бывает у многих моторов при обрыве ремня ГРМ?":"What happens in many engines if the timing belt snaps?","Поэтому ремень меняют строго по регламенту.":"That's why it's replaced strictly on schedule.","Клапаны встречаются с поршнями — дорогой ремонт":"Valves hit pistons — costly repair","Просто сядет аккумулятор":"The battery dies","Лопнут шины":"Tires burst","О чём говорит значок Check Engine?":"What does the Check Engine icon mean?","Подключи сканер и узнай код ошибки.":"Plug in a scanner and read the error code.","Есть ошибка в системе мотора — нужна диагностика":"A fault in the engine system — get diagnostics","Нужно долить омывайку":"Top up washer fluid","Какая жидкость работает в тормозной системе?":"Which fluid works in the brake system?","Тормозная жидкость передаёт давление и со временем впитывает влагу.":"Brake fluid transmits pressure and absorbs moisture over time.","Тормозная жидкость":"Brake fluid","Моторное масло":"Engine oil","Вода":"Water","Для чего нужен сход-развал?":"What is wheel alignment for?","Неправильные углы быстро «съедают» резину.":"Wrong angles chew up tires quickly.","Выровнять углы колёс, чтобы машина ехала прямо и шины не стирались":"Set wheel angles so the car goes straight and tires wear evenly","Поменять масло":"Change oil","Проверить фары":"Check lights","Что делает глушитель?":"What does the muffler do?","Выхлопные газы проходят через камеры, и звук затихает.":"Exhaust passes through chambers that dampen sound.","Гасит шум выхлопа":"Quiets exhaust noise","Заряжает батарею":"Charges the battery","Подаёт воздух":"Supplies air","Что значит «55» в маркировке шины 205/55 R16?":"What does \"55\" mean in tire size 205/55 R16?","205 — ширина в мм, 55 — высота профиля в процентах, R16 — диаметр диска.":"205 is width in mm, 55 is profile height in %, R16 is rim diameter.","Высота профиля — 55% от ширины":"Profile height is 55% of width","Скорость 55 км/ч":"Speed 55 km/h","Давление 55":"Pressure 55","Вес 55 кг":"Weight 55 kg","Загорелась лампа давления масла на ходу. Первое действие?":"The oil pressure light comes on while driving. First step?","Без масла мотор может выйти из строя за минуты.":"Without oil the engine can be ruined in minutes.","Ехать дальше до дома":"Drive home","Прибавить газ":"Accelerate","Залить антифриз":"Add coolant","Как правильно «прикурить» от другой машины?":"How do you jump-start correctly?","Последнее подключение — на массу вдали от аккумулятора, чтобы искра не воспламенила газы.":"The last clamp goes to ground away from the battery so a spark doesn't ignite gases.","Плюс на плюс, затем минус донора на кузов/массу заглохшей":"Plus to plus, then donor's minus to the dead car's body/ground","Минус на плюс":"Minus to plus","Только плюс, минус не нужен":"Only plus, no minus","Подключить обе клеммы к одному аккумулятору":"Both clamps on one battery","Что делает генератор?":"What does the alternator do?","Без генератора аккумулятор быстро разрядится.":"Without it the battery quickly drains.","Питает электрику и заряжает аккумулятор при работающем моторе":"Powers electrics and charges the battery while running","Крутит колёса":"Turns the wheels","Заводит мотор":"Starts the engine","Что делает масляный фильтр?":"What does the oil filter do?","Чистое масло лучше защищает мотор — фильтр меняют вместе с маслом.":"Clean oil protects better — change the filter with the oil.","Очищает масло от частиц и грязи":"Removes particles and dirt from oil","Охлаждает воздух":"Cools air","Гасит шум":"Dampens noise","Зачем нужен катализатор?":"Why is there a catalytic converter?","Он превращает вредные газы в менее опасные.":"It converts harmful gases into less harmful ones.","Снижает вредные выбросы":"Reduces harmful emissions","Греет салон":"Heats the cabin","Экономит масло":"Saves oil","Что даёт турбина мотору?":"What does a turbocharger give the engine?","Больше воздуха — больше топлива сгорит — больше мощности.":"More air means more fuel burned and more power.","Нагнетает больше воздуха и добавляет мощность":"Forces in more air for more power","Охлаждает масло":"Cools oil","Тормозит машину":"Brakes the car","Что проверяют щупом под капотом?" var TIPDB=[["🛢", "Масло", "Масло меняй раз в 10 000 км или раз в год. Я однажды забыл — мотор стучал так, будто просил пощады!"], ["🛞", "Шины", "Давление в шинах проверяй раз в месяц на холодных колёсах. Шина без воздуха — как я без кофе: еле еду."], ["🔩", "Колёса", "Болты колеса затягивай крест-накрест. Иначе колесо решит отправиться в самостоятельное путешествие!"], ["🔋", "Аккумулятор", "Зимой аккумулятор садится быстрее — он тоже мёрзнет. Проверь заряд до морозов, а не при минус двадцать."], ["🔴", "Клеммы", "Красный — плюс, чёрный — минус. Подключаешь: сначала плюс. Отключаешь: сначала минус. Я запомнил после искр!"], ["💡", "Лампы", "Лампы меняй парой: перегорела одна — вторая скоро следом. Фара с одним глазом — это не стиль, а штраф."], ["🧯", "Огнетушитель", "Огнетушитель и аптечка в машине — как запасной парашют: надеешься, что не пригодится, но с ним спокойнее. Смотри срок годности!"], ["🦺", "Ремень", "Пристёгивайся и сзади тоже! В аварии пассажир без ремня становится летающим багажом."], ["🚸", "Дистанция", "Держи две секунды дистанции: машина впереди проехала столб — считай «двадцать один, двадцать два». В дождь — вдвое больше."], ["❄", "Зима", "На льду тормозной путь в разы длиннее. Лихачить на льду — кататься как пингвин, только без смеха."], ["🌧", "Дождь", "В ливень включи ближний свет и сбрось скорость. «Поплыть» по лужам весело только уткам."], ["🧊", "Антифриз", "Антифриз не даёт мотору ни кипеть, ни замерзать. Воду из-под крана вместо него не лей — получишь ледяную скульптуру внутри мотора!"], ["🌡", "Перегрев", "Стрелка в красной зоне — остановись и заглуши мотор. Горячую крышку радиатора не открывай: фонтан будет не праздничный!"], ["🛑", "Колодки", "Скрип при торможении — колодки просят замены. Не жди скрежета металла: он обойдётся дороже."], ["👀", "Зеркала", "Настрой зеркала до выезда и всё равно оглядывайся: в слепой зоне любит прятаться чужая машина."], ["📱", "Телефон", "Телефон за рулём — враг. Секунда в экран на 90 км/ч — это 25 метров вслепую. Сообщение подождёт, дорога нет!"], ["😴", "Усталость", "Устал — остановись и отдохни, перерыв каждые два часа. Лучше вздремнуть на парковке, чем в кювете."], ["👶", "Дети", "Дети ездят только в кресле и пристёгнутыми — даже если «мы только до магазина»."], ["⛽", "Бензин", "Не гони бак «в ноль»: насос охлаждается топливом, а со дна может подняться грязь."], ["🔊", "Звуки", "Новый стук, скрип или вибрация — машина просит помощи, а не просто ворчит. Послушай её!"], ["🧼", "Чистота", "Чистые стёкла и фары — это безопасность. Шукур подметает мастерскую, а ты протри стёкла!"], ["🚦", "Жёлтый", "Жёлтый — это «приготовься тормозить», а не «газуй изо всех сил»."], ["🔦", "Свет", "Включай фары в сумерки и туман, не дожидаясь полной темноты: тебя должны видеть."], ["🧰", "Запаска", "Проверь запаску и домкрат заранее. Запаска без воздуха — просто тяжёлый бублик."], ["🧴", "Омывайка", "Зимой заливай незамерзающую омывайку. Летняя замёрзнет — и поедешь вслепую, как крот."], ["🕶", "Ослепили", "Ослепили встречные фары? Сбрось скорость, включи аварийку и смотри на правый край дороги, а не в свет."], ["🛞", "Протектор", "Глубину протектора проверяй монеткой или линейкой: летом минимум 1,6 мм, зимой лучше от 4. Лысая шина — это уже не шина, а лыжа!"], ["🔄", "Ротация шин", "Раз в 10–15 тысяч км меняй колёса местами: передние стираются быстрее. Пусть все шины работают поровну, как хорошая бригада!"], ["🔧", "Балансировка", "Руль дрожит на скорости? Пора на балансировку колёс. Руль танцует не от радости."], ["🧭", "Сход-развал", "Машину тянет в сторону на ровной дороге? Проверь сход-развал, иначе шина сотрётся с одного бока, как каблук у ходока."], ["💨", "Воздушный фильтр", "Воздушный фильтр меняй раз в год-два. Мотору нужно дышать, а не сквозь мокрый шарф."], ["🌬", "Салонный фильтр", "Салонный фильтр меняют раз в год. Если из печки пахнет носками — это он зовёт на помощь!"], ["🚿", "Омывайка", "Зимой в бачок омывателя нельзя лить обычную воду: замёрзнет и порвёт бачок."], ["🪟", "Щётки", "Дворники меняй раз в год. Если они размазывают грязь, как я краску по забору, — пора менять."], ["🔥", "Прогрев", "Зимой прогрей мотор минуту-две и поезжай плавно. Резкий старт на холодном моторе — как зарядка без разминки."], ["🧊", "Замёрзшие двери", "Замёрзли двери? Не дёргай и не лей кипяток: лопнет стекло. Используй размораживатель или тёплую воду."], ["🔑", "Замок зимой", "Замок примёрз — не ломай ключ. Нагрей ключ зажигалкой или залей размораживатель."], ["🏔", "Спуск", "На длинном спуске включай пониженную передачу: тормоза не перегреются, а ты не превратишься в сани."], ["🛣", "Обгон", "Обгоняй только когда видишь дорогу далеко вперёд. «А вдруг успею» — самая дорогая фраза на дороге."], ["🕑", "Скорость", "Знак ограничения — это максимум, а не рекомендация. В дождь и туман скорость выбирай ещё ниже."], ["🚧", "Ремонт дороги", "У дорожных работ сбавь скорость: там люди, и техника, и гравий в лобовое."], ["🦌", "Животные", "Ночью у леса дикие животные выходят на дорогу. Увидел — тормози, не виляй рулём."], ["🌫", "Туман", "В тумане включи ближний свет и противотуманки. Дальний свет только слепит тебя же — как фонарь в молоко."], ["☀", "Солнце", "Против низкого солнца надень очки и опусти козырёк. Ослеплённый водитель — слепой водитель."], ["🏁", "Старт", "Не газуй сразу после запуска мотора: пара секунд, пока масло дойдёт до всех деталей."], ["🅿", "Парковка", "Ставь машину на ручник, особенно на горке, а на склоне поверни колёса к бордюру."], ["🪞", "Задний ход", "Перед задним ходом обойди машину вокруг: маленький ребёнок или кошка могут быть за бампером."], ["🚪", "Дверь", "Открывай дверь правой рукой — тогда ты невольно оглянешься назад и не зацепишь велосипедиста."], ["🚲", "Велосипедист", "Обгоняя велосипедиста, оставляй не меньше метра. Он тоже хочет доехать домой."], ["🚶", "Пешеходы", "У перехода сбавь скорость заранее: пешеход не обязан угадывать, когда ты решишь затормозить."], ["🚌", "Автобус", "У остановки автобуса из-за него может выйти человек. Сбавь скорость и смотри внимательно."], ["🏫", "Школа", "Рядом со школой всегда едь медленнее: дети выбегают за мячом, не думая о машинах."], ["🚑", "Спецтранспорт", "Услышал сирену — прижмись вправо и дай дорогу. Не уступишь скорой — потом вспоминать будешь всю жизнь."], ["🚨", "Авария", "Попал в аварию — включи аварийку, выставь знак, вызови помощь, не двигай пострадавших без нужды."], ["🩹", "Аптечка", "В аптечке проверь срок годности бинтов и жгута. Просроченный пластырь — это просто шутка."], ["🧰", "Инструмент", "Минимальный набор в багажнике: домкрат, баллонный ключ, трос, провода для прикуривания, фонарик."], ["🔦", "Фонарик", "Фонарик в бардачке спасёт ночью, когда телефон сел. Проверь батарейки, не ленись."], ["🔌", "Зарядка", "Держи в машине зарядку для телефона. Разряженный телефон на трассе — это как водолаз без воздуха."], ["📍", "Навигатор", "Маршрут задай до выезда. Тыкать в навигатор на ходу — всё равно что играть на пианино ногами."], ["💧", "Течь", "Пятно под машиной утром — повод проверить: масло, антифриз или просто вода от кондиционера. Цвет и запах подскажут."], ["🟢", "Антифриз цвет", "Антифриз бывает зелёный, красный, синий. Разные классы не смешивай — получится кисель."], ["🔍", "Масло в моторе", "Уровень масла проверяй раз в пару недель на холодном моторе по щупу. Между метками — как раз."], ["🔴", "Масло долив", "Масла долил много — тоже плохо. Больше не значит лучше: уровень держи между метками."], ["🛢", "Вязкость", "Вязкость масла (например, 5W-30) выбирай по книжке к машине. Не по цвету канистры!"], ["🔋", "Ёмкость батареи", "Если стартер крутит еле-еле, аккумулятор слабеет. Не жди, когда он умрёт на морозе."], ["⚡", "Клеммы чистота", "Белый налёт на клеммах аккумулятора счищай и смазывай. Контакт должен блестеть, как зубы в рекламе."], ["🔌", "Прикуривание", "Прикуривая, не касайся клеммами друг друга и не наклоняйся над аккумулятором: там может быть искра и газ."], ["🚗", "Первая передача", "Не держи ногу на сцеплении без дела: выжим подшипник изнашивается. Поставил нейтраль — отпусти педаль."], ["🐢", "Экономия", "Плавный разгон и торможение экономят до пятой части бензина. Газуй как кот, а не как бык."], ["⛽", "Заправка", "Не заправляйся «под пробку»: бензин расширяется от тепла. Пара щелчков пистолета — и хватит."], ["🥶", "Холодный мотор", "В мороз не жми на газ сразу: загустевшее масло медленно растекается. Прогрей и поезжай плавно."], ["🌡", "Датчик", "Следи за температурой мотора на приборной панели. Лучше заметить рост заранее, чем стоять с дымом."], ["💡", "Лампа аккумулятора", "Загорелась лампочка аккумулятора на ходу? Генератор не заряжает. Доедь до ближайшего сервиса, отключи лишнее."], ["🧯", "Пожар", "Пожар в моторе: заглуши, выйди, открой капот не до конца и туши порошковым огнетушителем сквозь щель."], ["💥", "Подушки", "Подушка безопасности работает вместе с ремнём. Без ремня она может навредить, а не помочь."], ["👶", "Кресло", "Кресло для ребёнка выбирай по весу и росту, а не по цвету. Пристёгивай каждый раз, даже на пять минут."], ["🐶", "Питомцы", "Собака в машине — только в переноске или с ремнём. Резкое торможение превращает её в снаряд."], ["🧴", "Бутылки", "Не оставляй в салоне на солнце баллончики и пластиковые бутылки с водой: линза и взрыв нам не нужны."], ["🧤", "Перчатки", "Лёгкие перчатки зимой — это тепло и хорошее сцепление с рулём."], ["🕶", "Очки", "Тёмные очки днём, а ночью — никаких. Тёмные очки ночью — не стильно, а опасно."], ["🍔", "Еда", "Ешь на остановке, не за рулём. Бургер в одной руке — это руль в другой и мысли о соусе."], ["🥤", "Горячее", "Не держи горячий кофе в руке за рулём: на яме он станет сюрпризом."], ["🎶", "Музыка", "Музыку на полную не включай: сирену и сигнал не услышишь."], ["🪟", "Окно", "Лёд на стёклах счищай полностью, а не «глазок». Мелкий просвет — как смотреть в замочную скважину."], ["🍂", "Листья", "Мокрые листья на дороге скользкие, как мыло. Тормози заранее и плавно."], ["🕳", "Яма", "Яму лучше объехать, но не резко. Если ехать неизбежно — не тормози в самой яме: подвеска сильнее ломается."], ["💦", "Брод", "Заехал в большую лужу — потом просуши тормоза лёгким нажатием педали. Мокрые колодки хуже держат."], ["🏊", "Вода", "Если машина съехала в воду, сразу открывай окно и выбирайся: двери под давлением воды не открыть."], ["🛻", "Груз", "Груз в багажнике закрепляй. Любой предмет при резком торможении становится летающим."], ["🧳", "Багаж на крыше", "Багаж на крыше увеличивает расход топлива и меняет управляемость. Держи скорость ниже."], ["📏", "Колёсные диски", "Диски и шины подбирай по размерам из книжки. Колёса не должны быть «на глаз»."], ["🛠", "ТО", "Плановое ТО проходи вовремя: заменишь копейки сегодня, не заплатишь тысячи завтра."], ["📖", "Книжка", "Книжка к машине — лучший учебник. Там написано, какое масло, какое давление и что значат лампочки."], ["🔔", "Сигнал", "Сигналь коротко и только по делу. Гудок — не крик души, а предупреждение."], ["💤", "Сон", "Ночью за рулём сон подкрадывается быстро. Ощущаешь зевоту — остановись и выпей воды, а не кофе на ходу."], ["🧠", "Реакция", "Усталость, злость и грусть замедляют реакцию. Хочешь доехать — успокойся до выезда."], ["🍺", "Алкоголь", "Выпил — не садись за руль. Даже кружка пива меняет реакцию. Такси стоит дешевле, чем авария."], ["🕰", "Время", "Не спеши: пять минут опоздания дешевле, чем авария. Выезжай чуть раньше."], ["🌅", "Ночное вождение", "Ночью дистанции кажутся короче. Снижай скорость и держи фары чистыми."], ["🛡", "Привычка", "Хорошая привычка водителя — осмотреть колёса и лужи под машиной перед выездом. Пять секунд — и ты спокоен."], ["🏁", "Финиш", "Любишь скорость — иди на картинг. На дороге скорость нужна только чтобы доехать целым."], ["🧾", "Чек-лист", "Перед дальней дорогой проверь шины, масло, антифриз, свет и омывайку. Пять минут сейчас — и дорога без сюрпризов."], ["🗺", "Маршрут", "Перед поездкой посмотри маршрут и заправки по пути. Бак «на пять километров» — плохой план."], ["🧃", "Вода", "Положи в багажник бутылку воды: в пробке и на трассе жажда приходит внезапно."], ["🧥", "Тёплые вещи", "Зимой возить в багажнике тёплое одеяло и перчатки — хорошая идея. Замёрзший водитель — задумчивый водитель."], ["🪢", "Буксир", "Буксировочный трос должен быть в машине. Тянут медленно, ровно и без рывков, на скорости не больше 40."], ["🚛", "Грузовик", "Рядом с грузовиком держи дистанцию: у него огромные слепые зоны. Не видишь его зеркал — он не видит тебя."], ["🏍", "Мотоциклист", "Мотоциклист тоже участник движения. Перед поворотом посмотри ещё раз: он мог оказаться в слепой зоне."], ["🛴", "Самокаты", "Самокатчик может выскочить внезапно. На тротуаре и у переходов сбавь скорость."], ["🚏", "Остановка", "Объезжая стоящий автобус, помни: из-за него может выйти пешеход. Притормози заранее."], ["🧱", "Бордюр", "Не задевай бордюр колесом: можно повредить шину и рулевую. Паркуйся аккуратно."], ["🪵", "Груз на дороге", "Увидел упавшую коробку на трассе — не объезжай резко. Притормози, включи аварийку, объедь плавно."], ["⚠", "Знак аварии", "Если остановился на дороге, выставь знак аварийной остановки. Лучше потратить минуту, чем потерять машину."], ["🧨", "Шины перегрев", "В жару шины нагреваются и давление растёт. Не спускай воздух — это норма, но проверяй до поездки."], ["🌞", "Жара", "В жару не оставляй детей и животных в закрытой машине даже на минуту: салон нагревается как печка."], ["🍉", "Кондиционер", "Кондиционер включай заранее, а не когда уже жарко. Раз в год проверяй хладагент."], ["🌬", "Окна", "Открой окна перед включением кондиционера: сначала выгони горячий воздух."], ["🧊", "Лёд", "Скалывать лёд лопаткой с зубьев, а не ножом и не ключом. Стекло царапать не стоит."], ["🌨", "Снег", "Перед выездом убери снег с крыши: на ходу он слетит и закроет лобовое стекло тому, кто сзади."], ["🥾", "Обувь", "Сапоги за рулём неудобны — педали «чувствуются» хуже. Меняй обувь на тонкую подошву или держи сменную."], ["👟", "Тапки", "Шлёпанцы за рулём — плохая идея: можно соскользнуть с педали. Мухе простительно, тебе — нет."], ["🧤", "Руль", "Руль держи мягко, но уверенно. Если сжимать как верёвку, быстро устанешь."], ["💺", "Сиденье", "Отрегулируй сиденье так, чтобы колени были слегка согнуты, а спина упиралась. Тогда не устанешь и дотянешься до педалей."], ["🪑", "Подголовник", "Подголовник должен быть на уровне затылка. Это защита шеи, а не подушка для сна."], ["🧍", "Поза", "Не сутулься за рулём: спина болит, внимание падает. Выпрями плечи и выдохни."], ["👀", "Взгляд", "Смотри далеко вперёд, а не на капот. Тогда ты вовремя замечаешь опасности и ведёшь плавнее."], ["📣", "Предупреждение", "Включай аварийку, если вдруг впереди резкая пробка. Тем, кто сзади, важно знать заранее."], ["🛣", "Полосы", "Не меняй полосу без сигнала и взгляда в зеркало. «Я думал, там пусто» — не оправдание."], ["🚦", "Светофор", "Подъезжая к зелёному светофору, будь готов притормозить: он вот-вот сменится. Не гони на жёлтый."], ["🔄", "Круг", "На круговом движении уступай тем, кто уже едет по кругу (если нет других знаков). Помни про поворотники на выезде."], ["🔁", "Разворот", "Разворачиваясь, убедись, что нет встречных и позади. Разворот — самый «удивляющий» манёвр."], ["🅱", "Параллельная парковка", "На параллельной парковке медленно, с зеркалами и не бойся подъехать несколько раз. Лучше десять раз ровно, чем один раз по бамперу."], ["⬅", "Левый поворот", "Перед левым поворотом пропусти встречных. Не торопись, пока не уверен, что успеваешь."], ["⛔", "Знак «Кирпич»", "Знак «Въезд запрещён» — не обсуждается. Даже если «всего двадцать метров»."], ["🅿", "Парковка у выезда", "Не паркуйся у выездов и пожарных гидрантов: вдруг они понадобятся. Эвакуатор приедет быстрее, чем ты думаешь."], ["♿", "Места для инвалидов", "Места для людей с ограниченными возможностями — не для «на минутку». Эти метры — их дорога."], ["📵", "Звонки", "Звонки за рулём — только с гарнитурой, а лучше остановись. Разговор отвлекает больше, чем кажется."], ["🎧", "Наушники", "В наушниках за рулём ты не услышишь сирену и гудок. Музыку — через динамики, но тише."], ["🔆", "Яркость", "Приборную панель делай не слишком яркой ночью: глаза привыкают к темноте, а не к экрану."], ["🌙", "Ночью", "Ночью водителю сложнее оценить расстояние. Держи скорость, при которой успеешь остановиться в свете фар."], ["🔦", "Фары чистота", "Грязные фары светят вполовину слабее. Протирай их — особенно зимой."], ["🧽", "Мойка", "Моя машину не только ради красоты: грязь и соль зимой разъедают кузов. Особенно низ."], ["🧂", "Реагенты", "Зимой реагенты на дорогах портят кузов. Промывай днище после поездок по солёным дорогам."], ["🪣", "Ведро", "Не мой машину на холоде: вода замёрзнет в замках и на стёклах. Лучше в тёплый день или на мойке."], ["🧴", "Воск", "Воск или полироль защищают краску от солнца и грязи. Раз в сезон — и машина блестит."], ["🎨", "Царапина", "Мелкую царапину закрась вовремя, иначе под краской начнёт ржаветь металл. Ржавчина не лечится бесплатно."], ["🛠", "Ржавчина", "Ржавчина — рак машины: появляется под краской и растёт. Лечится зачисткой и обработкой на ранней стадии."], ["🪛", "Мелкий ремонт", "Простые вещи — лампы, щётки, фильтры — можно менять самому. Но тормоза и подушки — только мастеру."], ["🔩", "Момент затяжки", "Колёса затягивай динамометрическим ключом: без перетяжки и недотяжки. Слишком сильно — сорвёшь резьбу, слабо — колесо уйдёт."], ["📐", "Развал", "Если шина изнашивается только по внутреннему краю — проблема в развале. Заметил — иди на регулировку."], ["🔧", "Подтяжка колёс", "После замены колёс подтяни болты через 50–100 км. Мелочь, а спасает от потери колеса."], ["🧲", "Магнит", "Магнит в масляном картере собирает стружку. Если на нём много металла — мотор изнашивается."], ["🔎", "Осмотр", "Раз в месяц осматривай шины, свет, дворники и жидкости. Пять минут — и ты знаешь свою машину."], ["📏", "Зазор", "Тормозные диски стираются по миллиметру. Если на диске появился «ободок» — пора менять."], ["🛑", "Тормозной след", "Тормозная педаль провалилась или «мягкая»? Срочно к мастеру: в системе может быть воздух или утечка."], ["🚰", "Тормозная жидкость", "Тормозную жидкость меняют раз в 2–3 года: она впитывает влагу и закипает при торможении с горки."], ["🔥", "Горячие тормоза", "После долгого спуска тормоза горячие. Дай им остыть, не мой их ледяной водой."], ["🧯", "Дым", "Если из-под капота идёт дым — остановись, заглуши мотор, отойди. Не открывай капот сразу: можно получить ожог."], ["🌡", "Холодно", "Зимой аккумулятор отдаёт на 30–40% меньше энергии. Если стартер крутит вяло, проверь заряд."], ["🔌", "Подзарядка", "Если машина долго стоит, аккумулятор саморазряжается. Раз в месяц заводи или подзаряди."], ["🚗", "Долгая стоянка", "Перед долгой стоянкой накачай шины и отключи клемму. Тогда машина проснётся здоровой."], ["🚙", "Обкатка", "Новая машина требует обкатки: первые 1000–2000 км не гони и не перегружай."], ["🏷", "Покупка", "Покупая подержанную машину, проверь документы, историю ремонтов и обязательно покажи мастеру."], ["🔍", "VIN", "Сверь VIN-номер на кузове и в документах. Если не совпадает — вот тебе красный флаг."], ["📜", "Документы", "Всегда возьми с собой права, документ на машину и страховку. Отсутствие — штраф и нервы."], ["🧾", "Штрафы", "Проверяй штрафы онлайн: лишние начисления бывают, но просроченные штрафы растут."], ["🛡", "Страховка", "Страховка — не формальность. Прочитай, что она покрывает, и не пропускай срок."], ["🧮", "Расход", "Считай расход топлива раз в месяц. Скачок — сигнал: шины, фильтр или что-то ещё."], ["🏎", "Резкий разгон", "Резкий разгон и торможение увеличивают расход топлива до 30%. Ехать плавно — выгодно."], ["🚦", "Экономия в пробке", "В долгой пробке глуши мотор, если стоишь больше минуты. Но не на жаре и не в мороз."], ["🔗", "Цепи", "На горной дороге зимой возьми цепи противоскольжения. Тренируйся надевать заранее, а не в метель."], ["⛰", "Горы", "В горах на спуске держи пониженную передачу, на подъёме — не глуши мотор. И не обгоняй на поворотах."], ["🏜", "Песок", "По песку езди на пониженном давлении в шинах и без резких движений. Но потом накачай обратно."], ["🪨", "Камни", "Не гоняй по гравию: камешки летят в стёкла и краску. Держи дистанцию с едущими впереди."], ["🌊", "Паводок", "Не въезжай в воду на дороге, если не знаешь глубину. Хватает полметра, чтобы машину унесло."], ["🌪", "Ветер", "В сильный ветер держи руль крепче, особенно на мостах и открытых участках. Обгоняя грузовик, ветер может сильно толкнуть."], ["⛈", "Гроза", "В грозу машина — безопасное место: металл кузова защищает. Но не касайся металлических частей и не стой под деревьями."], ["🧊", "Гололёд", "На гололёде все движения плавные: газ, тормоз, руль. Один резкий жест — и ты в роли пингвина."], ["🦺", "Жилет", "Если вышел из машины на трассе — надень светоотражающий жилет. Тебя должны видеть издалека."], ["📟", "Радар", "Радар-детекторы и камеры на дороге — не повод сбавлять скорость только перед ними. Сбавляй всегда."], ["🔇", "Глушитель дыра", "Громкий выхлоп — признак дырявого глушителя. Помимо шума это ещё и выхлопные газы в салоне."], ["🫁", "Угарный газ", "Не сиди в закрытом гараже с работающим мотором: угарный газ без запаха, но смертельный."], ["🚰", "Конденсат", "Вода под машиной летом — часто конденсат кондиционера. Нормально, если прозрачная и без запаха."], ["🧴", "Жидкость ГУР", "Если руль стал тугим, проверь уровень жидкости гидроусилителя. Не забывай про неё, пока не заскулило."], ["🚘", "Новая лампочка", "Меняя лампу, не трогай стекло пальцами: жир оставляет пятно и колба быстро перегорает."], ["💡", "Светодиодные лампы", "Светодиодные лампы вместо галогенных могут слепить встречных. Ставь светодиоды только в фары с подходящей линзой."], ["🕶", "Тонировка", "Слишком тёмные стёкла ночью ухудшают обзор. Соблюдай разрешённые нормы."], ["🪟", "Лобовое стекло", "Трещину в лобовом стекле лучше заклеить сразу: она растёт от перепадов температур и вибраций."], ["🐞", "Камешек", "Мелкие сколы на стекле можно ремонтировать за недорого. Не дожидайся, пока они превратятся в трещину."], ["🪟", "Дворники зимой", "Не включай дворники на примёрзшем стекле: резина порвётся. Сначала размороз."], ["🔥", "Подогрев", "Подогрев сидений и стёкол включай заранее. Но не оставляй подогрев включённым надолго — аккумулятор не железный."], ["🧺", "Салон", "Не оставляй мусор и посторонние вещи под педалями: они могут застрять и поставить педаль в аварийное положение."], ["🧼", "Коврики", "Резиновые коврики спасают салон от грязи зимой. Закрепляй их штатными фиксаторами, чтобы не залезли под педали."], ["🛋", "Ремни детей", "Не пристёгивай ребёнка ремнём вместе с курткой: зимой куртка делает ремень слабым. Сними, пристегни, накрой курткой."], ["🚼", "Кресло возраст", "Кресло подбирай по весу ребёнка. Пока он мал, ездит спиной по ходу — это безопаснее."], ["🍼", "Детям", "Не давай детям на заднем сиденье острые игрушки и еду с косточками: резкое торможение опасно."], ["🧸", "Мягкие игрушки", "Мягкие игрушки на панели и полке у заднего стекла в аварии летят в голову. Убери их."], ["🪫", "Телефон держатель", "Телефон закрепляй в держателе, а не клади на сиденье. При торможении он улетит."], ["🧳", "Багажник", "Тяжёлое ставь на пол багажника ближе к спинке сиденья. Так машина устойчивее."], ["🪜", "Лестница", "Длинные предметы на крыше крепи ремнями и вешай красную тряпку на конец. Так тебя заметят."], ["🪝", "Фаркоп", "Прицеп цепляй по инструкции и проверяй свет и крепление. Тормозной путь с прицепом длиннее."], ["🏕", "Кемпинг", "Едешь в поход — возьми запасную канистру, воду и карту. Связь есть не везде."], ["🧭", "Компас", "Телефон может сесть, а компас останется. Держи бумажную карту или хотя бы запомни направление."], ["🔊", "Сигнал музыка", "Если на дороге нужно привлечь внимание — гудок, а не колонки. Музыка предупреждением не работает."], ["🚶", "Выход из машины", "Выходя на обочину, смотри на дорожное движение. Двери открывай осторожно: могут ехать машины и велосипеды."], ["🤝", "Помощь", "Если видишь на дороге людей в беде — остановись, включи аварийку, вызови помощь. Один звонок может спасти жизнь."], ["🆘", "Номера", "Запомни номера экстренных служб страны, где ты едешь. В экстренной ситуации искать их некогда."], ["📞", "Звонок в аварию", "Звоня в скорую, называй адрес, число пострадавших и что случилось. Спокойно и по делу."], ["🩸", "Кровотечение", "При сильном кровотечении прижми рану чистой тканью и наложи жгут выше раны. Запомни время наложения."], ["🤕", "Пострадавший", "Пострадавшего без необходимости не перемещай: можно навредить позвоночнику. Только если ему угрожает огонь или иная опасность."], ["🧯", "Огнетушитель тип", "Для машины нужен порошковый огнетушитель. Проверь манометр: стрелка в зелёной зоне."], ["🔥", "Пожар в салоне", "При пожаре в салоне останови машину, выйди и отойди подальше. Не лезь за вещами: жизнь дороже."], ["⛑", "Каска", "Мотоциклистам и велосипедистам — шлем обязателен. Мухе тоже: берегите головы!"], ["🧠", "Привычки", "Хорошие привычки: пристегнуться, проверить зеркала, глянуть на панель. Сделай их автоматическими."], ["🏆", "Опыт", "Опытный водитель — не тот, кто едет быстро, а тот, кто едет безопасно много лет."], ["🙏", "Благодарность", "Дал дорогу — мигни аварийкой «спасибо». Дорога становится добрее."], ["😊", "Вежливость", "Вежливость на дороге заразительна: уступи, пропусти, улыбнись. Почти как в мастерской у Шукура."], ["😤", "Агрессия", "Агрессивный водитель едет не быстрее, а нервнее. Дыши, считай до десяти и не отвечай на подрезы."], ["🐌", "Медленная езда", "Слишком медленная езда на трассе тоже опасна: за тобой собираются нервные водители. Держи скорость потока."], ["🪫", "Зарядка батареи", "Электромобиль не любит полного разряда и постоянной зарядки до 100%. Держи заряд в пределах 20–80%."], ["🔋", "Электромобиль", "Электромобиль тише бензиновых: пешеходы не слышат его. Будь внимателен на тихой скорости."], ["🔌", "Зарядка электро", "Электромобиль заряжай в проверенных розетках и станциях. Дешёвые удлинители могут перегреться."], ["🌱", "Экология", "Выключай мотор на длительных стоянках, регулярно меняй фильтры и масло — меньше выхлопа, чище воздух."], ["♻", "Утилизация", "Старое масло, аккумуляторы и шины не выбрасывай в мусор. Сдавай в специальные пункты."], ["🛢", "Слив масла", "Слитое масло нельзя лить на землю: одна капля загрязняет сотни литров воды. Сдай в приёмку."], ["🔑", "Ключи", "Не оставляй ключи и документы на видном месте в машине. Чужие глаза бывают любопытными."], ["🚨", "Сигнализация", "Сигнализация и механический блокиратор вместе защищают лучше, чем что-то одно."], ["🏠", "Гараж", "Парковка в гараже защищает машину от солнца, града и снега. Но проветривай помещение."], ["🌳", "Тень", "Летом ставь машину в тень: салон не нагреется как духовка, и пластик не потрескается."], ["🌰", "Деревья", "Под деревьями с липкой смолой и птицами парковаться не стоит: краска страдает. Мойка потом выйдет дороже."], ["🔨", "Град", "При граде сбавь скорость и съезжай под укрытие. Градины способны оставить вмятины на кузове."], ["🪟", "Окно в жару", "В жару не оставляй окна наглухо закрытыми для детей и животных: открой щель, хотя бы."], ["🧯", "Чехол", "Зимой чехол на лобовое стекло экономит время на очистке. Но убирай его перед поездкой, а не на ходу."], ["🔆", "Бликует", "Если приборы бликуют на солнце, поправь козырёк или наклон. Видеть показания нужно без напряжения."], ["🧪", "Охлаждающая жидкость", "Если уровень антифриза падает без видимых луж, возможна течь внутрь мотора. Проверь у мастера."], ["🔥", "Свечи зажигания", "Свечи меняй по регламенту: раз в 30–60 тыс. км. Изношенные свечи — больше расхода и рывков."], ["🌀", "Рывки", "Рывки при разгоне — повод проверить свечи, фильтр и подачу топлива. Не игнорируй."], ["🐢", "Троит", "Мотор «троит» — вибрирует и неровно работает? Скорее всего, проблема со свечами или катушкой. Диагностика поможет."], ["📉", "Падение мощности", "Машина стала вялой? Проверь воздушный и топливный фильтры, свечи. Часто причина простая."], ["🚿", "Выхлоп конденсат", "Капли воды из глушителя на холоде — это нормально: так выходит влага от сгорания."], ["🔓", "Замок багажника", "Не закрывай багажник на ключ, пока не убедился, что ключи не остались внутри. Мухе знакомо."], ["🔔", "Датчики парковки", "Датчики парковки помогают, но не заменяют глаза. Смотри в зеркала и оглядывайся."], ["📹", "Видеорегистратор", "Видеорегистратор в споре — лучший свидетель. Проверяй, что запись идёт и карта памяти работает."], ["📲", "Приложения", "Приложения для навигации и ремонта — полезны. Но пользуйся ими до выезда или при остановке."], ["💾", "Данные", "Не храни документы только в телефоне: батарея может сесть. Возьми копии на бумаге."], ["🕹", "Режимы", "Режимы «спорт» и «эко» меняют отклик педали и коробки. Выбирай по ситуации, а не по настроению."], ["🧭", "Круиз", "Круиз-контроль хорош на ровной трассе, но не в дождь и не на скользкой дороге. Ты всё равно отвечаешь за машину."], ["🛞", "Колёса сезон", "Меняй шины по сезону: зимой мягкая резина, летом жёсткая. Всесезонка — компромисс."], ["🛞", "Возраст шин", "Шины старше 6–8 лет лучше заменить, даже если протектор хороший: резина дубеет и трескается."], ["🛞", "Боковые порезы", "Грыжа или порез на боковине шины — повод заменить шину немедленно. Они не лечатся."], ["🛞", "Давление зимой", "Зимой давление в шинах падает на холоде. Проверяй чаще, чем летом."], ["🛞", "Разные шины", "Не ставь на одну ось шины разных моделей и износа: машина поведёт себя непредсказуемо."], ["⚙", "Коробка масло", "Масло в коробке передач тоже меняют. Забыли — через годы получим счёт побольше."], ["🔧", "Подшипник", "Гул колеса при езде — часто износ ступичного подшипника. Не затягивай, ремонт дешевле аварии."], ["🔧", "Стук подвески", "Стук на неровностях — признак износа амортизаторов или опор. Подвеска просит ремонта."], ["🔧", "ШРУС", "Хруст при повороте руля — износ ШРУСа. Не игнорируй: рано или поздно рассыпется на ходу."], ["🛠", "Ремень приводной", "Скрип ремня при запуске — он растянулся или износился. Пора менять, а то генератор перестанет заряжать."], ["🔥", "Охлаждение зима", "Зимой не закрывай радиатор картоном «для тепла» без нужды: можно перегреть мотор."], ["🎯", "Цель", "Цель водителя — не приехать первым, а приехать целым. Спешка на дороге — самая дорогая экономия времени."], ["🧘", "Спокойствие", "Перед поездкой сделай три глубоких вдоха. Спокойный водитель замечает больше и ошибается реже."], ["🚗", "Прогрев салона", "Зимой не садись в ледяной салон в тяжёлой куртке: ремень лежит неплотно. Сними лишнее и пристегнись правильно."], ["🍃", "Свежий воздух", "В долгой дороге периодически проветривай салон: духота усыпляет и снижает внимание."], ["☕", "Перерыв", "На остановке не только кофе, но и разминка. Походи пять минут, потянись — и снова бодр."], ["📻", "Радио", "Не переключай станции на ходу, а то внимание уедет с дороги. Настрой заранее."], ["🧵", "Ремень не перекручен", "Проверь, что ремень лежит ровно на плече и бёдрах, а не на шее или животе. Правильное положение спасает."], ["🚸", "Школьный автобус", "Остановившийся школьный автобус с мигающими огнями — повод остановиться и ждать. Дети рядом."], ["🏘", "Двор", "Во дворе скорость как у пешехода: там играют дети и выезжают соседи."], ["🚧", "Лежачий полицейский", "Перед «лежачим полицейским» сбавь скорость заранее. Подвеска тебя поблагодарит."], ["🪧", "Знаки", "Если не понял знак, не гадай: притормози, прочитай, оцени. Незнание знака не освобождает от ответственности."], ["📐", "Разметка", "Разметка тоже говорит: стрелки, линии, пунктиры. Читай её как вторую книгу правил."], ["🛰", "Спутник", "Навигатор иногда ошибается. Если маршрут ведёт в тупик или реку — думай головой."], ["🔆", "Лобовое чистота", "Грязное лобовое стекло ночью бликует от встречных фар. Протирай его изнутри и снаружи."], ["🧽", "Стёкла внутри", "Салонный налёт на стёклах изнутри тоже мешает. Раз в месяц протирай специальным средством."], ["🌫", "Запотевание", "Если стёкла запотевают, включи кондиционер и обдув стекла. Не вытирай рукой — только размазывать."], ["❄", "Иней", "Зимой салон может покрыться инеем изнутри. Не скобли ножом: используй мягкую щётку и обогрев."], ["🧰", "Ящик", "Держи под рукой запасные предохранители и лампы. Одна лампочка спасё  if(state==='menu')drawMenu();else if(state==='arrive')drawArrive();else if(state==='diag')drawDiag();else if(state==='fix'){FIX[job.type].update&&FIX[job.type].update(dt);if(state==='fix')drawFix();}else if(state==='pay')drawPay();else if(state==='oops')drawOops();else if(state==='shop')drawShop();else if(state==='tips')drawTips();else if(state==='quiz')drawQuiz();else if(state==='quizEnd')drawQuizEnd();else if(state==='build')drawBuild();
 drawFx(dt);ctx.restore();
 if(msg&&performance.now()<msgT){ctx.font='bold 15px system-ui';var w=ctx.measureText(msg).width+30;ctx.fillStyle='rgba(30,30,50,.9)';rr(W/2-w/2,H*.52,w,36,18);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(msg,W/2,H*.52+18);}
 requestAnimationFrame(loop);}
function inb(b,x,y){return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}
cv.addEventListener('pointerdown',function(e){lastAct=performance.now();initAudio();var x=e.clientX,y=e.clientY;ptr.down=true;ptr.x=ptr.lx=x;ptr.y=ptr.ly=y;ptr.moved=0;held=null;
 for(var i=0;i<holds.length;i++)if(inb(holds[i],x,y)){held=holds[i].id;return;}
 if(btns.some(function(b){return inb(b,x,y);}))return;
 if(state==='fix')FIX[job.type].down(x,y);else if(state==='build')buildDown(x,y);});
cv.addEventListener('pointermove',function(e){if(!ptr.down)return;var x=e.clientX,y=e.clientY;ptr.moved+=Math.hypot(x-ptr.lx,y-ptr.ly);ptr.x=x;ptr.y=y;
 if(state==='fix')FIX[job.type].move(x,y);else if(state==='build')buildMove(x,y);else if(state==='shop'){shopY+=y-ptr.ly;}ptr.lx=x;ptr.ly=y;});
function pup(){if(ptr.down){if(state==='fix')FIX[job.type].up();else if(state==='build')buildUp();}ptr.down=false;held=null;}
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
cv.addEventListener('click',function(e){if(ptr.moved>10&&(state==='shop'||state==='fix'||state==='build'))return;for(var i=btns.length-1;i>=0;i--){var b=btns[i];if(inb(b,e.clientX,e.clientY)){tick();b.fn();return;}}});

var QS=(function(){
var G=null,st=null,box=null,btnEl=null,shown=null,tEl=null,tT=0;
function day(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*-60000)/864e5);}
function key(){return 'qs_'+G.id;}
function load(){try{st=JSON.parse(localStorage.getItem(key())||'null');}catch(e){st=null;}
 st=st||{};st.life=st.life||{games:0,points:0,shares:0};st.ach=st.ach||{};st.streak=st.streak||0;
 if(st.day!==day()){st.day=day();st.p={games:0,points:0,shares:0};st.c={};st.all=0;}save();}
function save(){try{localStorage.setItem(key(),JSON.stringify(st));}catch(e){}}
function missions(){var P=G.P,n=day(),T5=[{k:'games',n:2},{k:'games',n:4},{k:'points',n:P},{k:'points',n:Math.round(P*2.5)},{k:'shares',n:1}];
 return [T5[n%5],T5[(n+2)%5],T5[(n+3)%5]];}
function mname(m){return m.k==='games'?T('Сыграй раундов: ')+m.n:m.k==='points'?T('Набери очков: ')+m.n:T('Позови друга');}
var ACH=[
 {id:'g1',n:'🎮 Первая игра',f:function(){return st.life.games>=1;}},
 {id:'g10',n:'🔟 10 игр',f:function(){return st.life.games>=10;}},
 {id:'g50',n:'🏅 50 игр',f:function(){return st.life.games>=50;}},
 {id:'p1',n:'⭐ Много очков',f:function(){return st.life.points>=G.P*20;}},
 {id:'p2',n:'🌟 Мастер',f:function(){return st.life.points>=G.P*100;}},
 {id:'sh',n:'👥 Позвал друга',f:function(){return st.life.shares>=1;}},
 {id:'s3',n:'🔥 3 дня подряд',f:function(){return st.streak>=3;}},
 {id:'s7',n:'🏆 Неделя подряд',f:function(){return st.streak>=7;}},
 {id:'all',n:'✅ Все задания дня',f:function(){return st.all>=3;}}];
function toast(s){try{if(!tEl){tEl=document.createElement('div');tEl.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(30,30,50,.92);color:#fff;font:bold 15px system-ui;padding:10px 16px;border-radius:18px;z-index:9999;max-width:88vw;text-align:center;display:none;pointer-events:none';document.body.appendChild(tEl);}
 tEl.textContent=s;tEl.style.display='block';clearTimeout(tT);tT=setTimeout(function(){tEl.style.display='none';},2600);}catch(e){}}
function reward(m){return G.reward?G.rewLabel(m):'';}
function check(){var ms=missions(),got=0;
 ms.forEach(function(m,i){var v=st.p[m.k]||0;if(v>=m.n){got++;if(!st.c[i]){st.c[i]=1;try{if(G.reward)G.reward(1);}catch(e){}toast('🎯 '+T('Задание выполнено!')+(G.reward?' +'+G.rewLabel(1):''));}}});
 st.all=got;
 ACH.forEach(function(a){if(!st.ach[a.id]&&a.f()){st.ach[a.id]=1;try{if(G.reward)G.reward(3);}catch(e){}setTimeout(function(){toast('🏅 '+T('Достижение: ')+T(a.n)+(G.reward?' +'+G.rewLabel(3):''));},700);}});
 save();paintBtn();}
function init(c){G=c;load();build();paintBtn();}
function done(pts){if(!G)return;if(st.day!==day())load();
 var d=day();if(st.last!==d){st.streak=(st.last===d-1)?st.streak+1:1;st.last=d;}
 st.life.games++;st.life.points+=Math.max(0,pts|0);st.p.games++;st.p.points+=Math.max(0,pts|0);check();}
function share(){if(!G)return;if(st.day!==day())load();st.life.shares++;st.p.shares++;check();}
function show(on){if(on===shown||!btnEl)return;shown=on;btnEl.style.display=on?'flex':'none';}
function paintBtn(){if(!btnEl)return;var ms=missions(),n=0;ms.forEach(function(m){if((st.p[m.k]||0)>=m.n)n++;});btnEl.innerHTML='🎯<span style="font-size:11px;margin-left:3px;font-weight:700">'+n+'/3</span>';}
function build(){try{
 btnEl=document.createElement('div');btnEl.style.cssText='position:fixed;left:8px;top:'+(8+(G.top||0))+'px;height:38px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.28);color:#fff;font:bold 18px system-ui;align-items:center;z-index:50;display:none;cursor:pointer;backdrop-filter:blur(4px)';
 btnEl.addEventListener('click',function(e){e.stopPropagation();open();});document.body.appendChild(btnEl);
 box=document.createElement('div');box.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10000;display:none;align-items:center;justify-content:center;font-family:system-ui,sans-serif';
 document.body.appendChild(box);}catch(e){}}
function open(){if(!box)return;if(st.day!==day())load();var ms=missions(),h='<div style="background:#fff;color:#222;border-radius:20px;width:min(340px,92vw);max-height:84vh;overflow:auto;padding:16px"><div style="font-size:21px;font-weight:800;text-align:center;margin-bottom:8px">🎯 '+T('Задания дня')+'</div>';
 ms.forEach(function(m,i){var v=Math.min(st.p[m.k]||0,m.n),ok=v>=m.n;h+='<div style="padding:9px 10px;border-radius:12px;margin-bottom:7px;background:'+(ok?'#d9f7e0':'#f4f0ff')+'"><div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700"><span>'+(ok?'✅ ':'')+mname(m)+'</span><span>'+v+'/'+m.n+'</span></div><div style="height:7px;border-radius:4px;background:#ddd;margin-top:6px;overflow:hidden"><div style="height:100%;width:'+Math.round(v/m.n*100)+'%;background:#8e5cf7"></div></div>'+(G.reward?'<div style="font-size:12px;color:#777;margin-top:4px">'+T('Награда: ')+G.rewLabel(1)+'</div>':'')+'</div>';});
 var na=0;ACH.forEach(function(a){if(st.ach[a.id])na++;});
 h+='<div style="font-size:18px;font-weight:800;margin:12px 0 6px">🏅 '+T('Достижения')+' '+na+'/'+ACH.length+'</div><div style="display:flex;flex-wrap:wrap;gap:6px">';
 ACH.forEach(function(a){var ok=st.ach[a.id];h+='<span style="padding:6px 10px;border-radius:14px;font-size:13px;font-weight:700;background:'+(ok?'#fff3b0':'#eee')+';color:'+(ok?'#222':'#999')+'">'+(ok?'':'🔒 ')+T(a.n)+'</span>';});
 h+='</div><div style="text-align:center;margin-top:10px;font-size:13px;color:#777">🔥 '+T('Дней подряд: ')+st.streak+'</div><button id="qsx" style="margin-top:12px;width:100%;padding:13px;border:0;border-radius:12px;background:#8e5cf7;color:#fff;font-size:17px;font-weight:700">'+T('Закрыть')+'</button></div>';
 box.innerHTML=h;box.style.display='flex';var x=document.getElementById('qsx');if(x)x.addEventListener('click',function(){box.style.display='none';});}
return {init:init,done:done,share:share,show:show};
})();


try{QS.init({id:'sh',P:60,reward:function(k){S.coins+=10*k;save2();},rewLabel:function(k){return '💰'+10*k}});setInterval(function(){try{QS.show(state==='menu')}catch(e){}},250);}catch(e){}
requestAnimationFrame(loop);
window.__dbg={startQuiz:startQuiz,qz:qz,qzNext:qzNext,get state(){return state;},setState:function(s){state=s;},get S(){return S;},get job(){return job;},get F(){return F;},get bld(){return bld;},startRepair:startRepair,startBuild:startBuild,startFix:startFix,pickDiag:pickDiag,fixDone:fixDone,TYPES:TYPES,BS:BS,get held(){return held;},setHeld:function(h){held=h;},slotXY:slotXY};
})();
</script>
